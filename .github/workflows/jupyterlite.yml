name: jupyterlite

# Builds a JupyterLite site with the notebooks and the package, so they run
# fully in the browser (Pyodide kernel), and deploys it to GitHub Pages.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build jupyterlite-core jupyterlite-pyodide-kernel jupyter-server jupyterlab_widgets
      - run: python -m build --wheel
      - run: jupyter lite build --contents notebooks --piplite-wheels dist/*.whl --output-dir _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
