name: pages

# Builds the documentation (MkDocs, at the site root) and a JupyterLite site
# with the notebooks and the package under lite/, so the notebooks run fully
# in the browser (Pyodide kernel), and deploys both to GitHub Pages.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build jupyterlite-core jupyterlite-pyodide-kernel jupyter-server jupyterlab_widgets ".[docs]"
      - run: mkdocs build --strict --site-dir _site
      - run: python -m build --wheel
      - run: jupyter lite build --contents notebooks --piplite-wheels dist/*.whl --output-dir _site/lite
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
