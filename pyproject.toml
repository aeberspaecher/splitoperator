[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "so_schroedinger"
version = "0.3.0"
description = "Split operator time propagation for the time-dependent Schroedinger equation"
readme = "README.md"
license = "BSD-2-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Alexander Eberspächer" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "scipy>=1.10", "matplotlib>=3.6"]

[project.optional-dependencies]
test = ["pytest", "nbformat", "nbclient", "ipykernel"]
notebooks = ["jupyterlab", "ipykernel"]

[tool.setuptools]
packages = ["so_schroedinger"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B"]
ignore = [
    "E731",  # lambda assignments are fine for short correlation functions
]

[tool.ruff.lint.pep8-naming]
# physics notation: potentials V, energies E, radii R, grids X, Y, ...
ignore-names = ["V", "dV", "V*", "_V*", "E*", "_E*", "R", "_R", "X", "Y", "L*", "_L*", "A*", "_A*", "C", "N", "T*", "Psi*", "delta_E", "*_E"]

[tool.ruff.lint.per-file-ignores]
"so_schroedinger/__init__.py" = ["F401", "F403"]  # re-exports
"tests/*" = ["E402"]  # matplotlib.use() before imports
"notebooks/*" = ["E402", "B007", "B905"]  # keep the examples short
